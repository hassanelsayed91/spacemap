[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacemap"
version = "1.0.0"
description = "Visual treemap of disk usage on Windows - find what is eating your space. Read-only by design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hassan Elsayed", email = "acc.hassan.2012@gmail.com" }]
keywords = ["windows", "disk-space", "treemap", "disk-usage", "visualization", "cli", "tkinter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hassanelsayed91/spacemap"
Issues = "https://github.com/hassanelsayed91/spacemap/issues"
Changelog = "https://github.com/hassanelsayed91/spacemap/blob/main/CHANGELOG.md"

[project.scripts]
spacemap = "spacemap.cli:main"

[tool.setuptools]
packages = ["spacemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
